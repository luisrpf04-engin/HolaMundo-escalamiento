<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Hola Mundo ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #6a11cb, #2575fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas flotantes */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite linear;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* Contenedor principal */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 80px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 60px rgba(255, 255, 255, 0.05);
            animation: containerPulse 4s ease-in-out infinite;
        }

        @keyframes containerPulse {
            0%, 100% {
                box-shadow: 
                    0 25px 50px rgba(0, 0, 0, 0.5),
                    inset 0 0 60px rgba(255, 255, 255, 0.05),
                    0 0 40px rgba(106, 17, 203, 0.4);
            }
            50% {
                box-shadow: 
                    0 25px 50px rgba(0, 0, 0, 0.5),
                    inset 0 0 60px rgba(255, 255, 255, 0.1),
                    0 0 80px rgba(37, 117, 252, 0.6);
            }
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #ff6ec4, #7873f5, #4ADEDE, #ff6ec4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            text-transform: uppercase;
            filter: drop-shadow(0 0 30px rgba(255, 110, 196, 0.6));
        }

        @keyframes shine {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .subtitle {
            margin-top: 20px;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: fadeIn 2s ease forwards;
            opacity: 0;
            animation-delay: 0.5s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .emoji {
            display: inline-block;
            animation: bounce 2s infinite;
            margin-top: 25px;
            font-size: 2.5rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Línea decorativa */
        .line {
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #4ADEDE, transparent);
            margin: 20px auto 0;
            border-radius: 2px;
            animation: expandLine 2s ease forwards;
            animation-delay: 1s;
        }

        @keyframes expandLine {
            to { width: 80%; }
        }
    </style>
</head>
<body>
    <!-- Partículas flotantes -->
    <div class="particles" id="particles"></div>

    <!-- Contenido principal -->
    <div class="container">
        <h1>Hola Mundo</h1>
        <div class="line"></div>
        <p class="subtitle">Bienvenido a la web</p>
        <div class="emoji">🚀</div>
    </div>

    <script>
        // Crear partículas flotantes
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 6 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
            particle.style.animationDelay = `${Math.random() * 10}s`;
            particle.style.opacity = Math.random() * 0.7 + 0.3;

            // Colores aleatorios brillantes
            const colors = ['#ff6ec4', '#7873f5', '#4ADEDE', '#ffffff', '#ffd93d'];
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];

            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
